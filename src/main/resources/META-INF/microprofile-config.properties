# Configurações padrão MicroProfile / Payara Micro
# Sobrescritas automaticamente por variáveis de ambiente em containers Docker

# PostgreSQL
POSTGRES_HOST=localhost
POSTGRES_PORT=5432
POSTGRES_DB=scoreboard
POSTGRES_USER=sb_user
POSTGRES_PASSWORD=sb_password

# RabbitMQ
RABBITMQ_HOST=localhost
RABBITMQ_PORT=5672
RABBITMQ_USER=sb_mq_user
RABBITMQ_PASS=sb_mq_password
RABBITMQ_EXCHANGE=scoreboard.exchange
RABBITMQ_QUEUE=scoreboard.queue
RABBITMQ_ROUTING_KEY=score.update

# Redis
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_RETRY_BACKOFF_INITIAL_MS=500
REDIS_RETRY_BACKOFF_MAX_MS=10000

# Paginação de Jogos
JOGOS_PAGE_SIZE_DEFAULT=20
JOGOS_PAGE_SIZE_MAX=100

